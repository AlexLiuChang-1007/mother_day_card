<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>母亲节贺卡 | For Mom</title>
<style>
* {margin: 0; padding: 0; box-sizing: border-box;}
body {
  min-height: 100vh;
  background: linear-gradient(145deg, #fff0f8, #ffe6f2, #ffdce8);
  font-family: "Segoe UI", "微软雅黑", sans-serif;
  overflow: hidden;
  position: relative;
}

/* 星空花瓣飘落 */
.fall-item {
  position: fixed;
  top: -8%;
  pointer-events: none;
  z-index: 1;
  animation: fallRotate linear infinite;
  opacity: 0.85;
}
@keyframes fallRotate {
  0% {transform: translateY(0) rotate(0deg); opacity: 0.9;}
  100% {transform: translateY(100vh) rotate(360deg); opacity: 0;}
}

/* 书本贺卡外层 */
.book {
  position: relative;
  width: 90%;
  max-width: 460px;
  height: 80vh;
  margin: 10vh auto 0;
  perspective: 1500px;
  z-index: 2;
}

/* 单页样式 + 翻页3D */
.page {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 15px 50px rgba(200,130,160,0.35);
  transform-origin: left center;
  transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
  overflow: hidden;
  padding: 40px 25px;
  text-align: center;
}

/* 封面 */
.page-cover {
  background: linear-gradient(160deg, #fdd8e8, #f8c8dc);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.cover-title {
  font-size: 34px;
  color: #c72c61;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 20px;
  opacity: 0;
  animation: fadeUp 2s ease forwards 0.5s;
}
.cover-sub {
  font-size: 16px;
  color: #a06080;
  opacity: 0;
  animation: fadeUp 2s ease forwards 0.8s;
}
.tip-open {
  position: absolute;
  bottom: 40px;
  font-size: 14px;
  color: #b888a0;
  animation: blink 2s infinite;
}
@keyframes blink {0%,100%{opacity:0.5;}50%{opacity:1;}}

/* 内页文字 */
.inner-title {
  font-size: 28px;
  color: #c72c61;
  margin-bottom: 25px;
}
.text-line {
  font-size: 16px;
  color: #555;
  line-height: 2.2;
  opacity: 0;
}
.signature {
  position: absolute;
  bottom: 50px;
  right: 30px;
  font-size: 17px;
  color: #c72c61;
  font-weight: bold;
}

/* 翻页激活态 */
.book.open .page-cover {
  transform: rotateY(-180deg);
}
.page-inner {
  transform: rotateY(180deg);
}
.book.open .page-inner {
  transform: rotateY(0deg);
}

/* 文字逐字浮现 */
@keyframes fadeUp {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}

/* 点击爱心特效 */
.heart-burst {
  position: fixed;
  pointer-events: none;
  font-size: 22px;
  z-index: 99;
  animation: burstFly 2s ease-out forwards;
}
@keyframes burstFly {
  0% {opacity:1; transform:translateY(0) scale(1);}
  100% {opacity:0; transform:translateY(-220px) scale(1.5);}
}

/* 背景音乐隐藏 */
audio {display: none;}
</style>
</head>
<body>
<audio id="bgm" loop preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/05/22/audio_9c6f3a7aa6.mp3" type="audio/mpeg">


<div class="book" id="bookWrap">
  <!-- 封面页 -->
  <div class="page page-cover">
    <div class="cover-title">母亲节快乐</div>
    <div class="cover-sub">To My Dearest Mom</div>
    <div class="tip-open">点击任意位置 翻开贺卡 ✨</div>
  </div>

  <!-- 内页 -->
  <div class="page page-inner">
    <div class="inner-title">致最美的妈妈</div>
    <div class="text-line">
      谢谢你一路包容、一路守护<br>
      为我遮风挡雨，给我无尽温柔<br>
      时光慢慢走，愿你永远安康<br>
      永远优雅，永远被幸福环绕<br>
      往后的日子，换我好好陪伴你 ❤️
    </div>
    <div class="signature">爱你的儿子：Alex</div>
  </div>
</div>

<script>
// 生成花瓣星光飘落
const fallEmoji = ['🌸','💮','✨','💕','🌹','💖'];
function createFall() {
  let el = document.createElement('div');
  el.className = 'fall-item';
  el.innerHTML = fallEmoji[Math.floor(Math.random()*fallEmoji.length)];
  el.style.left = Math.random()*100 + '%';
  el.style.fontSize = Math.random()*12 + 14 + 'px';
  el.style.animationDuration = Math.random()*5 + 5 + 's';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),12000);
}
setInterval(createFall,280);

// 翻书交互：点击翻开/合上
const book = document.getElementById('bookWrap');
let isOpen = false;
document.addEventListener('click', ()=>{
  isOpen = !isOpen;
  if(isOpen){
    book.classList.add('open');
    // 触发背景音乐
    const bgm = document.getElementById('bgm');
    bgm.volume = 0.3;
    bgm.play().catch(e=>{});
    // 内页文字动画
    document.querySelector('.text-line').style.animation = 'fadeUp 2s ease forwards 0.6s';
  }else{
    book.classList.remove('open');
  }
});

// 点击炸裂爱心
document.addEventListener('click', e=>{
  for(let i=0;i<10;i++){
    setTimeout(()=>{
      let h = document.createElement('div');
      h.className = 'heart-burst';
      let arr = ['❤️','💖','💗','⭐','💞'];
      h.innerHTML = arr[Math.floor(Math.random()*arr.length)];
      h.style.left = e.clientX + (Math.random()-0.5)*100 + 'px';
      h.style.top = e.clientY + 'px';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),2000);
    },i*50);
  }
});
</script>
</body>
</html>
