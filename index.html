<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>母亲节快乐 · 专属贺卡</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {
  min-height:100vh;
  background:linear-gradient(160deg,#fef2f8,#ffe8f0,#fff5f8);
  font-family:"微软雅黑",sans-serif;
  overflow-x:hidden;
  position:relative;
}
.petal{
  position:fixed;
  top:-10%;
  z-index:1;
  pointer-events:none;
  animation:fall linear infinite;
  opacity:0.85;
}
@keyframes fall{
  0%{transform:translateY(0) rotate(0deg) skewX(0deg);opacity:0.9;}
  50%{transform:translateY(50vh) rotate(180deg) skewX(10deg);opacity:0.7;}
  100%{transform:translateY(100vh) rotate(360deg) skewX(-10deg);opacity:0;}
}
.card-wrap{
  position:relative;
  z-index:2;
  width:92%;
  max-width:480px;
  margin:80px auto 0;
  background:#fff;
  border-radius:24px;
  box-shadow:0 12px 48px rgba(220,150,180,0.35);
  padding:48px 32px;
  text-align:center;
  animation:cardIn 2s cubic-bezier(0.25,0.46,0.45,0.94);
}
@keyframes cardIn{
  0%{opacity:0;transform:scale(0.92) translateY(40px);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}
h1{
  font-size:36px;
  background:linear-gradient(90deg,#d6336c,#b76092);
  -webkit-background-clip:text;
  color:transparent;
  margin-bottom:16px;
  letter-spacing:2px;
}
.sub-tit{
  color:#b87a98;
  font-size:18px;
  margin-bottom:36px;
  opacity:0;
  animation:fadeUp 1.5s ease-out 0.5s forwards;
}
.words{
  color:#555;
  font-size:17px;
  line-height:2.4;
  margin:30px 0;
  opacity:0;
  animation:fadeUp 1.5s ease-out 0.8s forwards;
}
.sign{
  margin-top:48px;
  color:#d6336c;
  font-size:18px;
  font-weight:bold;
  opacity:0;
  animation:fadeUp 1.5s ease-out 1.1s forwards;
}
.bottom-tip{
  margin-top:36px;
  font-size:14px;
  color:#bb99aa;
  opacity:0;
  animation:fadeUp 1.5s ease-out 1.4s forwards;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
.heart-pop{
  position:fixed;
  pointer-events:none;
  font-size:24px;
  z-index:99;
  animation:popFly 2s ease-out forwards;
}
@keyframes popFly{
  0%{opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-250px) scale(1.6);}
}
</style>
</head>
<body>
<div class="card-wrap">
  <h1>母亲节快乐</h1>
  <div class="sub-tit">致我全世界最美的妈妈</div>
  <div class="words">
    时光缓缓，岁月温柔<br>
    谢谢你包容我的任性与孩子气<br>
    谢谢你为这个家默默付出、遮风挡雨<br>
    愿岁月善待你，不留风霜、只留笑颜<br>
    愿你永远平安健康，美丽无忧、被爱包围<br>
    往后余生，换我好好爱你、守护你 ❤️
  </div>
  <div class="sign">爱你的儿子：Alex</div>
  <div class="bottom-tip">时光慢一点 · 爱你多一点</div>
</div>

<script>
function createPetal(){
  const p = document.createElement('div');
  p.className = 'petal';
  let arr = ['🌸','💮','💕','✨','🌹'];
  p.innerHTML = arr[Math.floor(Math.random()*arr.length)];
  p.style.left = Math.random()*100 + '%';
  p.style.fontSize = Math.random()*14 + 16 + 'px';
  p.style.animationDuration = Math.random()*6 + 7 + 's';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),14000);
}
setInterval(createPetal,350);

document.addEventListener('click',e=>{
  for(let i=0;i<8;i++){
    setTimeout(()=>{
      let h = document.createElement('div');
      h.className='heart-pop';
      let arr = ['❤️','💖','💗','⭐','💞'];
      h.innerHTML = arr[Math.floor(Math.random()*arr.length)];
      h.style.left = e.clientX + (Math.random()-0.5)*80 + 'px';
      h.style.top = e.clientY + 'px';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),2000);
    },i*60);
  }
});
</script>
</body>
</html>
