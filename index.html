<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>致最亲爱的妈妈 ❤️ - Alex</title>
    <style>
        :root {
            --p-pink: #ffafbd;
            --s-pink: #ffc3a0;
            --t-brown: #5d4037;
            --gold: #d4af37;
            --glass: rgba(255, 255, 255, 0.85);
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #fff5ee; font-family: -apple-system, "SF Pro Display", "PingFang SC", sans-serif; }
        
        /* 动态渐变背景 */
        .layer-bg { position: fixed; inset: 0; z-index: -2; }
        .bg-gradient {
            width: 100%; height: 100%;
            background: linear-gradient(125deg, #ff9a9e, #fecfef, #feada6, #fad0c4);
            background-size: 400% 400%;
            animation: moveBG 15s ease infinite;
        }
        @keyframes moveBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        
        /* 场景切换动画 */
        .scene { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; text-align: center; }
        .active { display: flex; animation: sceneSwitch 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes sceneSwitch { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        .glass-card {
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 35px; border: 1px solid rgba(255,255,255,0.85);
            padding: 35px 25px; width: 100%; max-width: 380px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
        }
        
        .shimmer-text {
            background: linear-gradient(to right, #5d4037 0%, #d4af37 50%, #5d4037 100%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite; font-weight: bold;
        }
        @keyframes shimmer { to { background-position: 200% center; } }
        
        .btn-main {
            margin-top: 25px; padding: 16px 40px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: #fff; border-radius: 50px; border: none;
            font-weight: bold; font-size: 1.05rem; cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 117, 140, 0.45);
            transition: all 0.3s;
        }
        .btn-main:active { transform: scale(0.92); }
        
        /* 相册样式 */
        .photo-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; width: 100%; -webkit-overflow-scrolling: touch; }
        .photo-scroll img { width: 220px; height: 280px; object-fit: cover; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); flex-shrink: 0; border: 4px solid #fff; }
        
        /* 飘落物 */
        .fall-emoji { position: fixed; z-index: -1; animation: falling 8s linear infinite; pointer-events: none; }
        @keyframes falling { to { transform: translateY(110vh) rotate(480deg); } }

        .coupon {
            background: #fff; padding: 15px 10px; border-radius: 15px; border: 1px dashed #ffafbd;
            font-size: 0.85rem; color: #ff758c; transition: 0.3s;
        }
        
        @keyframes popHeart {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1.5) translateY(-50px); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="layer-bg"><div class="bg-gradient"></div></div>
<div class="layer-decor" id="decor-container"></div>

<button id="music-toggle" style="position:fixed;top:20px;right:20px;z-index:1000;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.8);border:1px solid #fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 5px 15px rgba(0,0,0,0.1);" onclick="togglePlay()">🔇</button>

<audio id="bgm" loop src="https://www.image2url.com/r2/default/audio/1778340688432-2f2eae9e-cb05-4a95-95cb-a345b08abf41.mp3"></audio>

<div class="layer-ui">
    <section class="scene active" id="s1">
        <div onclick="nextScene(2)" style="cursor:pointer;">
            <div class="envelope" style="width:220px;height:160px;background:#fff;position:relative;box-shadow:0 20px 40px rgba(0,0,0,0.15);border-radius:8px;margin:0 auto; display: flex; align-items: center; justify-content: center;">
                <div style="font-size:42px;animation:pulse 1.4s infinite;">❤️</div>
            </div>
        </div>
        <h2 class="shimmer-text" style="margin-top:50px;font-size:26px;letter-spacing:6px;">妈妈，见字如面</h2>
        <p style="color:#5d4037;opacity:0.75;margin-top:12px;">点击信封开启我们的故事</p>
    </section>

    <section class="scene" id="s2">
        <canvas id="garden-canvas" style="position:absolute;inset:0;z-index:1;touch-action:none;"></canvas>
        <div class="glass-card" id="garden-tip" style="z-index:10; pointer-events:none; transition: all 0.6s ease;">
            <p class="shimmer-text" style="font-size:1.35rem;">在这里，画出一片春天给妈妈</p>
            <p style="margin-top:10px;color:#666;">用手指轻轻滑动吧～</p>
        </div>
        <button class="btn-main" style="position:absolute;bottom:80px;z-index:100;" onclick="nextScene(3)">花开好了，继续走 ❤️</button>
    </section>

    <section class="scene" id="s3">
        <div class="glass-card">
            <h2 class="shimmer-text" style="margin-bottom:20px;">我们一起的回忆</h2>
            <div class="photo-scroll">
                <img src="https://www.image2url.com/r2/default/images/1778383189492-6a8c1202-3732-4748-9311-e463decd3070.jpg" alt="回忆1">
                <img src="https://www.image2url.com/r2/default/images/1778383803750-fe4de659-b202-491b-b4b0-5b882ab706a2.jpg" alt="回忆2">
                <img src="https://www.image2url.com/r2/default/images/1778384911756-00e8d8da-6b4f-4bc8-8994-1ace1e97bc52.jpg" alt="回忆3">
                <img src="https://i.ibb.co/JFt56r5H/IMG-4824.jpg" alt="回忆4">
            </div>
            <p style="font-size:0.85rem; color:#999; margin-top:10px;">⬅️ 左右滑动翻看照片 ➡️</p>
            <button class="btn-main" onclick="nextScene(4)">这些回忆，我永远珍惜</button>
        </div>
    </section>

    <section class="scene" id="s4">
        <div class="glass-card">
            <div style="font-size:48px;margin-bottom:15px;">🌸</div>
            <h2 class="shimmer-text">写给妈妈的话</h2>
            <div id="typed" style="min-height:140px;color:var(--t-brown);line-height:1.85;font-size:1.05rem;margin:20px 0;text-align:left;"></div>
            <button class="btn-main" onclick="nextScene(5)">继续 ❤️</button>
        </div>
    </section>

    <section class="scene" id="s5">
        <div class="glass-card">
            <h3 class="shimmer-text">Alex 的默契挑战</h3>
            <p id="quiz-question" style="margin:20px 0; font-size:1.1rem; min-height:80px; color:#5d4037;"></p>
            <div id="quiz-options" style="display:flex;flex-direction:column;gap:12px;"></div>
        </div>
    </section>

    <section class="scene" id="s6">
        <div class="glass-card">
            <h3 class="shimmer-text" style="font-size:23px;">爱意无限公司兑换券</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0;">
                <div class="coupon" onclick="use(this)">一整周洗碗</div>
                <div class="coupon" onclick="use(this)">全身按摩30分钟</div>
                <div class="coupon" onclick="use(this)">陪逛街不抱怨</div>
                <div class="coupon" onclick="use(this)">一周早睡券</div>
            </div>
            <button class="btn-main" onclick="finalSurprise()">❤️ 全部收下 + 最终惊喜 ❤️</button>
        </div>
    </section>
</div>

<script>
    // ==================== 音乐 ====================
    const bgm = document.getElementById('bgm');
    let isPlaying = false;
    function togglePlay() {
        const btn = document.getElementById('music-toggle');
        if (isPlaying) { bgm.pause(); btn.innerText = "🔇"; }
        else { bgm.play(); btn.innerText = "🎵"; }
        isPlaying = !isPlaying;
    }

    // ==================== 场景切换 ====================
    function nextScene(idx) {
        document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
        document.getElementById('s'+idx).classList.add('active');
        if (idx === 2) { initGarden(); if(!isPlaying) togglePlay(); }
        if (idx === 4) { startTyping(); }
        if (idx === 5) { startQuiz(); }
    }

    // ==================== 种花花园 (Fix: 一触即消) ====================
    function initGarden() {
        const c = document.getElementById('garden-canvas');
        const tip = document.getElementById('garden-tip');
        const ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        let hasStarted = false;

        function hideTip() {
            if (!hasStarted) {
                tip.style.opacity = '0';
                tip.style.transform = 'scale(0.8) translateY(-20px)';
                setTimeout(() => { tip.style.display = 'none'; }, 600);
                hasStarted = true;
            }
        }

        c.addEventListener('touchstart', hideTip);
        c.addEventListener('touchmove', e => {
            e.preventDefault();
            hideTip();
            const touch = e.touches[0];
            for(let i = 0; i < 3; i++) {
                drawFlower(touch.clientX + (Math.random()-0.5)*50, touch.clientY + (Math.random()-0.5)*50);
            }
        }, {passive: false});

        function drawFlower(x, y) {
            const colors = ['#ff758c', '#ffb6c1', '#ff9a9e', '#ffd1dc'];
            ctx.fillStyle = colors[Math.floor(Math.random()*colors.length)];
            for(let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.arc(x + Math.cos(i*0.8)*18, y + Math.sin(i*0.8)*18, 14, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.fillStyle = "#fff9c4"; ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2); ctx.fill();
        }
    }

    // ==================== 打字机 ====================
    function startTyping() {
        const text = "亲爱的妈妈，\n\n感谢您一直以来像超人一样为我遮风挡雨。\n我所有的勇敢、善良和坚持，都来自您的教导。\nAlex已经长大，以后让我来照顾您。\n愿您每天都像花儿一样开心。\n\n永远爱您的儿子\nAlex ❤️";
        let i = 0;
        const target = document.getElementById('typed');
        target.innerHTML = "";
        const timer = setInterval(() => {
            if (i < text.length) {
                target.innerHTML += text[i] === '\n' ? '<br>' : text[i];
                i++;
            } else clearInterval(timer);
        }, 80);
    }

    // ==================== 小测试（Fix: 所有选项都正确） ====================
    let currentQuiz = 0;
    const quizzes = [
        { q: "妈妈最喜欢 Alex 叫她什么？", a: ["妈妈","亲爱的妈妈","女神"] },
        { q: "妈妈最常对 Alex 叮嘱的一句话？", a: ["多吃点","早点睡","注意安全"] },
        { q: "今天是什么日子？", a: ["平凡的一天","Alex爱妈妈的一天","母亲节"] }
    ];

    function startQuiz() {
        currentQuiz = 0;
        showQuestion();
    }
    function showQuestion() {
        const q = quizzes[currentQuiz];
        document.getElementById('quiz-question').innerText = q.q;
        const container = document.getElementById('quiz-options');
        container.innerHTML = "";
        q.a.forEach((option) => {
            const btn = document.createElement('button');
            btn.className = "btn-main";
            btn.style.fontSize = "0.95rem";
            btn.innerText = option;
            btn.onclick = () => {
                currentQuiz++;
                if (currentQuiz < quizzes.length) showQuestion();
                else nextScene(6);
            };
            container.appendChild(btn);
        });
    }

    // ==================== 兑换券 & 最终惊喜 ====================
    function use(el) {
        if (!el.classList.contains('used')) {
            el.classList.add('used');
            el.style.textDecoration = "line-through";
            el.style.opacity = "0.6";
            el.innerHTML += " ✅";
            if (navigator.vibrate) navigator.vibrate(50);
        }
    }

    function finalSurprise() {
        for(let i = 0; i < 80; i++) {
            setTimeout(() => {
                const h = document.createElement('div');
                h.style.cssText = `position:fixed;top:-60px;left:${Math.random()*100}%;font-size:${Math.random()*28+22}px;z-index:9999;pointer-events:none;`;
                h.innerHTML = ['❤️','🌹','💐','💖','🌸'][Math.floor(Math.random()*5)];
                document.body.appendChild(h);
                setTimeout(() => {
                    h.style.transition = 'transform 4s linear';
                    h.style.transform = `translateY(${window.innerHeight+200}px) rotate(${Math.random()*800}deg)`;
                }, 30);
                setTimeout(() => h.remove(), 4500);
            }, i * 45);
        }
        setTimeout(() => {
            alert("妈妈，母亲节快乐！\nAlex永远爱您 ❤️\n这个小网页是我用心做的，希望您喜欢！");
        }, 1800);
    }

    // ==================== 飘落装饰 ====================
    setInterval(() => {
        const e = document.createElement('div');
        e.className = 'fall-emoji';
        e.innerHTML = ['🌸','💗','✨','🌷'][Math.floor(Math.random()*4)];
        e.style.left = Math.random()*100 + '%';
        e.style.fontSize = Math.random()*18 + 16 + 'px';
        document.getElementById('decor-container').appendChild(e);
        setTimeout(() => e.remove(), 9000);
    }, 350);

    // 全局点击爱心反馈
    document.addEventListener('click', (e) => {
        const heart = document.createElement('div');
        heart.style.cssText = `position:fixed;left:${e.clientX-15}px;top:${e.clientY-15}px;font-size:30px;z-index:999;pointer-events:none;animation:popHeart 1s forwards;`;
        heart.innerHTML = '💕';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1000);
    });
</script>
</body>
</html>
