<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>母亲节快乐 ❤️ For Mom</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:Arial,"微软雅黑",sans-serif;
  background:linear-gradient(140deg,#ffe6f0,#fff0f6,#ffe6f3);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* 飘落动画 */
.fall{
  position:fixed;
  top:-10%;
  z-index:1;
  pointer-events:none;
  animation:falling 6s linear infinite;
}
@keyframes falling{
  0%{transform:translateY(0) rotate(0deg);opacity:0.9;}
  100%{transform:translateY(100vh) rotate(360deg);opacity:0;}
}

/* 贺卡容器 - 手机100%兼容 */
.card{
  position:relative;
  z-index:2;
  width:92%;
  max-width:480px;
  margin:60px auto 0;
  background:#fff;
  border-radius:24px;
  box-shadow:0 10px 40px rgba(210,140,170,0.3);
  padding:40px 30px;
  text-align:center;
}

/* 封面 */
.cover{
  display:block;
}
.cover h1{
  font-size:34px;
  color:#d93a70;
  margin:20px 0 10px;
}
.cover p{
  color:#b46b8d;
  font-size:16px;
  margin-bottom:30px;
}
.btn-open{
  background:#d93a70;
  color:white;
  border:none;
  padding:14px 28px;
  border-radius:30px;
  font-size:16px;
  margin-top:20px;
}

/* 内页 */
.inner{
  display:none;
}
.inner h2{
  font-size:28px;
  color:#d93a70;
  margin-bottom:25px;
}
.inner .text{
  color:#444;
  font-size:16px;
  line-height:2.3;
  text-align:left;
}
.sign{
  text-align:right;
  margin-top:30px;
  font-size:17px;
  color:#d93a70;
  font-weight:bold;
}

/* 点击爱心 */
.heart{
  position:fixed;
  pointer-events:none;
  z-index:99;
  animation:fly 1.6s ease-out forwards;
}
@keyframes fly{
  0%{opacity:1;transform:scale(1);}
  100%{opacity:0;transform:translateY(-200px) scale(1.5);}
}

/* 音乐 */
audio{display:none;}
</style>
</head>

<body>
<audio id="bgm" loop>
  <source src="https://audio.pixabay.com/download/audio/2022/05/22/audio_9c6f3a7aa6.mp3" type="audio/mpeg">
</audio>

<!-- 飘落元素 -->
<div id="fallContainer"></div>

<!-- 贺卡 -->
<div class="card">
  <div class="cover" id="cover">
    <h1>母亲节快乐</h1>
    <p>To My Dearest Mom</p>
    <button class="btn-open" onclick="openCard()">点我打开贺卡 ✨</button>
  </div>

  <div class="inner" id="inner">
    <h2>致我最爱的妈妈</h2>
    <div class="text">
      感谢你一直以来的包容与守护<br>
      为我付出所有，给我最温暖的家<br>
      愿岁月温柔待你，健康常伴<br>
      愿你永远快乐、永远美丽、永远被爱<br>
      往后余生，换我好好爱你 ❤️
    </div>
    <div class="sign">爱你的儿子：Alex</div>
  </div>
</div>

<script>
// 飘落花瓣
const emojis = ['🌸','💮','🌹','✨','💕','💖'];
function makeFall() {
  let f = document.createElement('div');
  f.className = 'fall';
  f.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];
  f.style.left = Math.random()*100 + '%';
  f.style.fontSize = Math.random()*12 + 16 + 'px';
  f.style.animationDuration = Math.random()*4 + 5 + 's';
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),10000);
}
setInterval(makeFall,350);

// 打开贺卡
function openCard() {
  document.getElementById('cover').style.display = 'none';
  document.getElementById('inner').style.display = 'block';
  
  // 播放音乐
  let bgm = document.getElementById('bgm');
  bgm.volume = 0.3;
  bgm.play().catch(err=>{});
}

// 点击爱心爆炸
document.addEventListener('click',(e)=>{
  for(let i=0;i<10;i++){
    setTimeout(()=>{
      let h = document.createElement('div');
      h.className = 'heart';
      h.innerHTML = ['❤️','💖','💗','⭐'][Math.floor(Math.random()*4)];
      h.style.left = e.clientX + (Math.random()-0.5)*80 + 'px';
      h.style.top = e.clientY + 'px';
      h.style.fontSize = Math.random()*10 + 20 + 'px';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),1600);
    },i*50);
  }
});
</script>
</body>
</html>
